<title>Spring Spec vs Measured</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  /* Same chrome as momentum-carousel.html: dark ground, Source Serif 4, mono labels, one marigold accent, squared edges. */
  :root { --bg: #ecebe6; --ink: #1c1a17; --ink-soft: rgba(28,26,23,.65); --rule: rgba(28,26,23,.25); --accent: #f09f26; --accent-ink: #1c1a17; --graph-bg: #fafaf7; color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Source Serif 4", Georgia, serif; }
  main { max-width: 1100px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  h1 { font-weight: 400; margin: 0 0 4px; }
  p.lede { color: var(--ink-soft); margin: 0 0 20px; max-width: 65ch; }
  .bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 24px; }
  button { background: var(--accent); color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 0; padding: 7px 12px; font: 600 12px "JetBrains Mono", monospace; text-transform: uppercase; letter-spacing: .06em; cursor: pointer; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--rule); }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  figure { margin: 0 0 28px; }
  canvas { max-width: 100%; height: auto; display: block; border: 1px dashed var(--rule); }
  canvas { background: var(--graph-bg); }
  figcaption { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 6px; font: 12px "JetBrains Mono", monospace; color: var(--ink-soft); }
  body.export { background: var(--graph-bg); }
  body.export canvas { border: 0; }
  body.export main { padding: 0; max-width: none; }
</style>

<main>
  <h1>Spring spec vs measured</h1>
  <p class="lede">Graphics on a #fafaf7 background, sized for a 1080 px wide slide. Measured values are solid lines, spec values (Claude) are dashed. The PNG buttons work when this file is opened locally from docs/social/spring-spec-vs-measured.html.</p>
  <div class="bar"><button id="all">Download all</button></div>
  <div id="list"></div>
</main>

<script>
const q = new URLSearchParams(location.search);
const THEMES = {
  dark: { ink: '#E3E3E3', soft: 'rgba(227,227,227,.62)', grid: 'rgba(227,227,227,.09)', rule: 'rgba(227,227,227,.18)',
          axis: 'rgba(227,227,227,.4)', halo: '#0e0d0b',
          yellow: '#f2c94c', blue: '#6b9cf0', red: '#ef6a5e', green: '#5cc98a' },
  light: { ink: '#1c1a17', soft: 'rgba(28,26,23,.62)', grid: 'rgba(28,26,23,.08)', rule: 'rgba(28,26,23,.18)',
           axis: 'rgba(28,26,23,.45)', halo: '#fafaf7', bg: '#fafaf7',
           yellow: '#c9970a', blue: '#2f6fd6', red: '#cf3b33', green: '#2b8a52' },
};
let theme = 'light';
let C = THEMES[theme];
const SERIF = '"Source Serif 4", Georgia, serif';
const MONO = '"JetBrains Mono", ui-monospace, monospace';

// ---- Data (lbs) ----
const XS = [4, 8];
const SPRINGS = [
  { name: 'Yellow', key: 'yellow', spec: [3, 4.6],     measured: [3.9, 5.6] },
  { name: 'Blue',   key: 'blue',   spec: [7.7, 10.7],  measured: [6.8, 9.7] },
  { name: 'Red',    key: 'red',    spec: [10.6, 15],   measured: [10.7, 15.6] },
  { name: 'Green',  key: 'green',  spec: [15.8, 22.5], measured: [16.83, 24.8] },
];
const pct = (m, s) => (m - s) / s * 100;
const fmtPct = v => (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(1) + '%';

function mono(ctx, text, x, y, { size = 22, color = C.soft, align = 'left', weight = 400, upper = true, track = 0.12 } = {}) {
  ctx.font = `${weight} ${size}px ${MONO}`; ctx.letterSpacing = `${size * track}px`;
  const t = upper ? text.toUpperCase() : text;
  const w = ctx.measureText(t).width - size * track;
  ctx.fillStyle = color; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText(t, align === 'right' ? x - w : align === 'center' ? x - w / 2 : x, y);
  ctx.letterSpacing = '0px';
}

// ---- Graph ----
function graph(ctx, w, h) {
  // One set of axes; each tick shows imperial with metric underneath.
  const L = 204, R = w - 24, T = 130, B = h - 196, GAP = 26; // GAP = space between axis line and tick labels
  const KG_PER_LB = 0.45359237, CM_PER_IN = 2.54;
  const xMin = 4, xMax = 8, yMax = 30;
  const X = v => L + (v - xMin) / (xMax - xMin) * (R - L), Y = f => B - (f / yMax) * (B - T);

  // Legend
  ctx.font = `400 30px ${MONO}`; ctx.textBaseline = 'middle'; ctx.textAlign = 'left';
  // Right-aligned to the plot's right edge
  const LEGEND = [['Measured', []], ['Spec', [14, 10]]];
  const legendW = LEGEND.reduce((sum, [label]) => sum + 72 + ctx.measureText(label).width, 0) + 44 * (LEGEND.length - 1);
  let lx = R - legendW; const ly = 24;
  LEGEND.forEach(([label, dash]) => {
    ctx.strokeStyle = C.ink; ctx.lineWidth = 6; ctx.setLineDash(dash); ctx.lineCap = 'butt';
    ctx.beginPath(); ctx.moveTo(lx, ly); ctx.lineTo(lx + 58, ly); ctx.stroke(); ctx.setLineDash([]);
    ctx.fillStyle = C.ink; ctx.fillText(label, lx + 72, ly);
    lx += 72 + ctx.measureText(label).width + 44;
  });

  // Grid + ticks
  ctx.font = `400 22px ${MONO}`; ctx.lineWidth = 2;
  ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  // Few ticks, big type: easier to read on a phone.
  for (let f = 0; f <= yMax; f += 10) {
    ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(L, Y(f)); ctx.lineTo(R, Y(f)); ctx.stroke();
    ctx.font = `400 28px ${MONO}`; ctx.fillStyle = C.ink; ctx.fillText(f + ' lbs', L - GAP, Y(f) - 14);
    ctx.font = `400 22px ${MONO}`; ctx.fillStyle = C.soft; ctx.fillText((f * KG_PER_LB).toFixed(1) + ' kg', L - GAP, Y(f) + 16);
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  [4, 6, 8].forEach(x => {
    ctx.strokeStyle = C.grid; ctx.beginPath(); ctx.moveTo(X(x), T); ctx.lineTo(X(x), B); ctx.stroke();
    ctx.font = `400 28px ${MONO}`; ctx.fillStyle = C.ink; ctx.fillText(x + '"', X(x), B + GAP);
    ctx.font = `400 22px ${MONO}`; ctx.fillStyle = C.soft; ctx.fillText((x * CM_PER_IN).toFixed(1) + ' cm', X(x), B + GAP + 34);
  });
  ctx.strokeStyle = C.axis; ctx.lineWidth = 2.5;
  ctx.beginPath(); ctx.moveTo(L, T); ctx.lineTo(L, B); ctx.lineTo(R, B); ctx.stroke();
  // Axis titles
  ctx.fillStyle = C.ink; ctx.font = `400 42px ${SERIF}`; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  ctx.fillText('Spring stretch', (L + R) / 2, B + GAP + 104);
  ctx.save(); ctx.translate(24, (T + B) / 2); ctx.rotate(-Math.PI / 2);
  ctx.textBaseline = 'middle'; ctx.fillText('Force', 0, 0); ctx.restore();

  // Lines: spec dashed first, measured solid on top
  ['spec', 'measured'].forEach(kind => {
    SPRINGS.forEach(s => {
      const col = C[s.key], p = s[kind];
      ctx.strokeStyle = col; ctx.lineWidth = kind === 'measured' ? 6 : 4.5; ctx.lineCap = 'round';
      ctx.setLineDash(kind === 'spec' ? [14, 11] : []);
      ctx.beginPath(); ctx.moveTo(X(XS[0]), Y(p[0])); ctx.lineTo(X(XS[1]), Y(p[1])); ctx.stroke();
      ctx.setLineDash([]);
    });
  });
}

// ---- % difference table ----
function table(ctx, w, h) {
  const top = 40, rowH = 92, c1 = w * 0.62, c2 = w - 16;
  mono(ctx, 'Spring', 8, top, { size: 22 });
  mono(ctx, 'At 4"', c1, top, { size: 22, align: 'right' });
  mono(ctx, 'At 8"', c2, top, { size: 22, align: 'right' });
  const rule = y => { ctx.strokeStyle = C.rule; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); };
  rule(top + 22);
  SPRINGS.forEach((s, i) => {
    const mid = top + 22 + rowH * i + rowH / 2;
    ctx.fillStyle = C[s.key]; ctx.fillRect(8, mid - 16, 32, 32);
    ctx.fillStyle = C.ink; ctx.font = `400 40px ${SERIF}`; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
    ctx.fillText(s.name, 64, mid);
    ctx.font = `400 44px ${SERIF}`; ctx.textAlign = 'right';
    ctx.fillText(fmtPct(pct(s.measured[0], s.spec[0])), c1, mid);
    ctx.fillText(fmtPct(pct(s.measured[1], s.spec[1])), c2, mid);
    if (i < SPRINGS.length - 1) rule(top + 22 + rowH * (i + 1));
  });
  mono(ctx, '(measured − spec) ÷ spec', 8, h - 12, { size: 19, upper: false, track: 0.04 });
}

const GRAPHICS = [
  { id: 'fig-01-spec-vs-measured', w: 1000, h: 780, draw: graph },
  { id: 'fig-02-percent-difference', w: 1000, h: 470, draw: table },
];

const fileName = g => `${g.id}.png`;
const PAD = 80; // breathing room on every side for screen grabs
function render(cv, g) {
  const ctx = cv.getContext('2d');
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = C.bg; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.translate(PAD, PAD);
  g.draw(ctx, g.w, g.h);
}

async function main() {
  try { await Promise.all([`400 40px ${SERIF}`, `600 40px ${SERIF}`, `400 20px ${MONO}`, `600 20px ${MONO}`].map(f => document.fonts.load(f))); } catch (e) {}
  const list = document.getElementById('list');
  if (q.has('g')) {
    document.body.classList.add('export');
    document.querySelectorAll('h1, .lede, .bar').forEach(el => el.remove());
    const g = GRAPHICS.find(x => x.id === q.get('g'));
    const cv = Object.assign(document.createElement('canvas'), { width: g.w + 2 * PAD, height: g.h + 2 * PAD });
    list.appendChild(cv); render(cv, g);
    return;
  }
  const items = GRAPHICS.map(g => {
    const fig = document.createElement('figure');
    const cv = Object.assign(document.createElement('canvas'), { width: g.w + 2 * PAD, height: g.h + 2 * PAD });
    const cap = document.createElement('figcaption');
    const name = document.createElement('span');
    const btn = Object.assign(document.createElement('button'), { className: 'ghost', textContent: 'PNG' });
    btn.onclick = () => save(cv, g);
    cap.append(name, btn); fig.append(cv, cap); list.appendChild(fig);
    return { g, cv, name };
  });
  const paint = () => {
    C = THEMES[theme];
    items.forEach(({ g, cv, name }) => { render(cv, g); name.textContent = fileName(g); });
  };
  document.getElementById('all').onclick = async () => {
    for (const { g, cv } of items) { save(cv, g); await new Promise(r => setTimeout(r, 300)); }
  };
  paint();
}
function save(cv, g) { const a = document.createElement('a'); a.download = fileName(g); a.href = cv.toDataURL('image/png'); a.click(); }
main();
</script>
